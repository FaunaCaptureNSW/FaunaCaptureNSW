<!DOCTYPE html>
<html>
<head>
  <title>FaunaCapture</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    body { margin: 0; font-family: Arial; }
    #map { height: 90vh; }
    .topbar { padding: 10px; background: #2f4f2f; color: white; }
    button { margin: 5px; padding: 10px; }
  </style>
</head>
<body>

<div class="topbar">
  <b>FaunaCapture</b>
  <button onclick="exportData()">Export Data</button>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
  var map = L.map('map').setView([-32.9, 151.7], 10);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: 'Map data © OpenStreetMap'
  }).addTo(map);

  var points = [];

  map.on('click', function(e) {
    var marker = L.marker(e.latlng).addTo(map);

    var species = prompt("Enter species:");
    var count = prompt("Count:");

    var record = {
      lat: e.latlng.lat,
      lng: e.latlng.lng,
      species: species,
      count: count
    };

    points.push(record);

    marker.bindPopup(species + " (" + count + ")");
  });

  function exportData() {
    var dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(points));
    var dl = document.createElement('a');
    dl.setAttribute("href", dataStr);
    dl.setAttribute("download", "fauna_data.json");
    dl.click();
  }
</script>

</body>
</html>
